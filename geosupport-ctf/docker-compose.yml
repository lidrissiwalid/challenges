###############################################################################
# GeoSupport CTF — Docker Compose
#
# Network topology:
#
#   proxy-net : nginx  ↔ web
#   app-net   : web    ↔ mongo
#   bot-net   : bot    ↔ web  (internet access allowed for webhook exfil)
#   flag-net  : ssrf-worker only (internal, no internet)
#
# The flag lives inside the ssrf-worker container on its loopback interface.
# The player reaches it via SSRF: http://127.0.0.1/flag.txt
# No other container can reach that loopback.
###############################################################################

services:

  # ── Reverse proxy ───────────────────────────────────────────────────────────
  nginx:
    build: ./reverse-proxy
    networks:
      - proxy-net
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    depends_on:
      - web
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # ── Web application ─────────────────────────────────────────────────────────
  web:
    build: ./web
    networks:
      - proxy-net
      - app-net
      - bot-net
    volumes:
      - queue-data:/var/queue
    environment:
      PORT:                 "3000"
      MONGO_URI:            "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin"
      APP_SECRET:           "${APP_SECRET}"
      ADMIN_SESSION_TOKEN:  "${ADMIN_SESSION_TOKEN}"
      SEED_USER_EMAIL:      "${SEED_USER_EMAIL}"
      SEED_USER_PASSWORD:   "${SEED_USER_PASSWORD}"
      QUEUE_PATH:           "/var/queue"
      NODE_ENV:             "production"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    networks:
      - app-net
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD}"
      MONGO_INITDB_DATABASE:      "${MONGO_INITDB_DATABASE}"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    cap_drop:
      - NET_ADMIN
      - SYS_PTRACE
      - SYS_MODULE
    security_opt:
      - no-new-privileges:true

  # ── Administrator bot ───────────────────────────────────────────────────────
  admin-bot:
    build: ./admin-bot
    networks:
      - bot-net
    environment:
      APP_ORIGIN:           "http://web:3000"
      ADMIN_SESSION_TOKEN:  "${ADMIN_SESSION_TOKEN}"
      BOT_POLL_INTERVAL_MS: "8000"
      BOT_VISIT_TIMEOUT_MS: "15000"
    depends_on:
      - web
    restart: unless-stopped
    cap_drop:
      - NET_ADMIN
      - SYS_MODULE
      - SYS_RAWIO
      - SYS_PTRACE
      - SYS_PACCT
      - SYS_BOOT
      - SYS_NICE
      - SYS_TTY_CONFIG
      - MKNOD
      - AUDIT_WRITE
      - AUDIT_CONTROL
      - MAC_OVERRIDE
      - MAC_ADMIN
      - NET_BIND_SERVICE
    cap_add:
      - SYS_ADMIN
    # no-new-privileges omitted — Chromium sandbox requires setuid

  # ── SSRF worker + internal flag server ─────────────────────────────────────
  # The flag server binds to 127.0.0.1:80 inside this container only.
  # The player reaches it via SSRF: http://127.0.0.1/flag.txt
  ssrf-worker:
    build: ./ssrf-worker
    networks:
      - flag-net
    volumes:
      - queue-data:/var/queue
    environment:
      QUEUE_PATH: "/var/queue"
      FLAG:       "${FLAG}"
      NODE_ENV:   "production"
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # needed to bind port 80 on loopback as non-root
    security_opt:
      - no-new-privileges:true

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  proxy-net:
    driver: bridge
    internal: false
  app-net:
    driver: bridge
    internal: true
  bot-net:
    driver: bridge
    internal: false   # bot needs internet for external webhook exfiltration
  flag-net:
    driver: bridge
    internal: true    # ssrf-worker only, no internet

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mongo-data:
    driver: local
  queue-data:
    driver: local
